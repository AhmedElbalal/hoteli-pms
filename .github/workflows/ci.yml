name: HOTELI CI
on:
  push:
    branches: [main, docs/hoteli-audit-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm run install:all
      - name: Run server tests
        run: npm test
      - name: Build client
        run: npm run build
      - name: Audit root dependencies
        run: npm audit --audit-level=moderate
      - name: Audit server dependencies
        run: npm audit --prefix server --audit-level=moderate
      - name: Audit client dependencies
        run: npm audit --prefix client --audit-level=moderate
